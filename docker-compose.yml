services:
  db:
    image: postgres:16
    container_name: clitodolist-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?start via 'go run . serve'}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?start via 'go run . serve'}
      POSTGRES_DB: ${POSTGRES_DB:?start via 'go run . serve'}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clitodolist-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?start via 'go run . serve'}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?start via 'go run . serve'}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data: